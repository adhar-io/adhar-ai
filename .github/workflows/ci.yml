name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Install
        run: uv sync --frozen --extra rag
      - name: Lint
        run: uv run ruff check src tests
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q
      - name: Tool-registry snapshot
        # The MCP tool schemas are the contract with the Go CLI (ADR-0024 §10);
        # a drift here is a breaking change, not a refactor.
        run: |
          uv run adhar-ai tools > /tmp/tools.json
          diff -u contract/tools.json /tmp/tools.json

      - name: End-to-end (seven MCP servers + the runtime, over real HTTP)
        # The unit suite drives tools in-process and fakes the toolbox, so it
        # cannot see the defects that only exist once real processes talk to
        # each other: the transport's Host-header guard, the MCP client's result
        # unwrapping, and whether an unconfigured backend's error text survives
        # the trip to the model. Every one of those shipped broken at some point
        # while the unit suite was green.
        #
        # Needs no cluster, no key and no database — what it asserts is either
        # true offline or honestly reported as unavailable, which is the
        # property being tested.
        run: ./hack/e2e-local.sh
        env:
          # The platform docs are not checked out here, so grounding falls back
          # to this repo's own docs tree. The assertion is that lexical
          # retrieval is LIVE, not how many chunks it found.
          DOCS: docs
